description: Earli is a biotech company using AI-designed genetic switches for early
  cancer detection and treatment. Its synthetic-biomarker technology forces cancer
  cells to reveal themselves for earlier, more accurate detection, and can program
  cancer cells to self-destruct while sparing healthy tissue. Founded by Cyriac Roeding
  and backed by a16z and Menlo Ventures, Earli is a research-stage company with no
  public developer platform, API, or SDK surface. This profile was added to the API
  Evangelist network as a venture-portfolio lead awaiting further enrichment.
